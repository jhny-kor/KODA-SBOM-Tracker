    .label { font-size: 11px; font-weight: 650; }
    .metric { font-size: 23px; font-weight: 750; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
    .line { stroke: #d8e0e5; stroke-width: 1; }
    .dark-line { stroke: #bcc8cf; stroke-width: 1; }
    .accent-line { stroke: #087b82; stroke-width: 2; }
    .nav-label { font-size: 10px; fill: #f5fafc; }
    .nav-muted { font-size: 10px; fill: #afc3cc; }
    .white { fill: #fff; }
