<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="screens-title screens-desc">
  <title id="screens-title">KODA SBOM Tracker 주요 화면 예시</title>
  <desc id="screens-desc">KODA SBOM Tracker의 대시보드, SBOM 회차, 설정 화면을 실제 메뉴와 기능에 맞춰 단순화한 정적 와이어프레임입니다.</desc>
