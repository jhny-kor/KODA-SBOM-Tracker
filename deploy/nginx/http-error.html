<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>페이지를 열 수 없습니다 | KODA SBOM Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      color: #172b4d;
      background: #f5f7fb;
      font: 1rem/1.6 system-ui, sans-serif;
    }
    main {
      width: min(100%, 32rem);
      padding: clamp(1.5rem, 5vw, 2.5rem);
      border: 1px solid #dce4ef;
      border-radius: 1rem;
      background: #fff;
    }
    .brand { color: #395780; font-size: .875rem; font-weight: 700; }
    h1 { margin: .5rem 0; font-size: clamp(1.4rem, 5vw, 1.9rem); }
    p { margin: 0 0 1.5rem; }
    a {
      display: inline-block;
      padding: .55rem 1rem;
      border-radius: .5rem;
      color: #fff;
      background: #2257a7;
      font-weight: 700;
      text-decoration: none;
    }
    a:focus-visible { outline: 2px solid #172b4d; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <span class="brand">KODA SBOM Tracker</span>
    <h1>페이지를 열 수 없습니다</h1>
    <p>주소를 확인하거나 Tracker 홈으로 이동해 주세요. 문제가 계속되면 관리자에게 문의해 주세요.</p>
    <a href="/">Tracker 홈으로</a>
  </main>
</body>
</html>
