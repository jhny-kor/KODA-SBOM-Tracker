server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  error_page 400 401 402 403 404 405 406 413 500 501 502 503 504 505 /__tracker_http_error.html;

  location = /__tracker_http_error.html {
    internal;
    alias /etc/nginx/tracker-http-error.html;
    add_header Cache-Control "no-store" always;
  }

  location / {
    # The Tracker's navigation uses query parameters on the root document.
    try_files $uri $uri/ =404;
  }
}

