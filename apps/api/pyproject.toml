[project]
name = "koda-sbom-tracker-api"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi==25.1.0",
  "cryptography==50.0.2",
  "cel-expr-python==0.1.3",
  "defusedxml==0.7.1",
  "fastapi==0.135.4",
  "httpx==0.28.1",
  "ldap3==2.9.1",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]
postgres = ["psycopg[binary]==3.2.13"]

[project.scripts]
koda-tracker-api = "koda_tracker.main:run"
koda-tracker-worker = "koda_tracker.worker:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["koda_tracker"]

[tool.pytest.ini_options]
testpaths = ["../../tests/backend"]
pythonpath = ["."]
